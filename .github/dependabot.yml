version: 2
updates:
  # Only the actions in .github/workflows. Cargo updates come as deliberate PRs,
  # and security fixes through Dependabot security updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Minor and patch bumps come in one PR; each major bump comes in its own.
    groups:
      actions-minor:
        update-types: [minor, patch]
