[package]
name = "validator-p2p-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/apastushenka/validator-p2p-monitor"
publish = false

[dependencies]
anyhow = { version = "1.0.105" }
blake2 = { version = "0.10.6" }
bs58 = { version = "0.5.1" }
clap = { version = "4.6.9", features = ["derive"] }
futures = { version = "0.3.34" }
hex = { version = "0.4.3" }
ip_network = { version = "0.4.1" }
itertools = { version = "0.14.0" }
libp2p = { version = "0.57.1", features = ["dns", "ed25519", "kad", "macros", "noise", "tcp", "tokio", "websocket", "yamux"] }
parity-scale-codec = { version = "3.7.5" }
prost = { version = "0.14.6" }
schnorrkel = { version = "0.11.5", default-features = false, features = ["getrandom"] }
sha2 = { version = "0.11.1" }
subxt = { version = "0.51.1", features = ["reconnecting-rpc-client"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["join-map"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
