[package]
name = "validator-p2p-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/apastushenka/validator-p2p-monitor"
publish = false

[dependencies]
anyhow = { version = "1.0.105" }
clap = { version = "4.6.9", features = ["derive"] }
futures = { version = "0.3.34" }
hex = { version = "0.4.3" }
ip_network = { version = "0.4.1" }
libp2p = { version = "0.57.1", features = ["dns", "ed25519", "kad", "macros", "noise", "tcp", "tokio", "websocket", "yamux"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
sha2 = { version = "0.11.1" }
subxt = { version = "0.51.1" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
