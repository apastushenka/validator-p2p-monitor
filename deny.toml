[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Only licenses that crates in the graph use; a PR that brings a new one adds it here.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
